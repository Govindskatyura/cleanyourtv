plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.govindskatyura.cleanhome'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.govindskatyura.cleanhome'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '1.1.3'
    }

    buildTypes {
        release {
            // No libraries at all, so R8 only has our own code to shrink: the APK stays in the tens of KB.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
